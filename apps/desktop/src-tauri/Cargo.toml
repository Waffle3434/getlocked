[package]
name = "getlocked-desktop"
description = "GetLocked desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "getlocked-desktop"

[lib]
name = "getlocked_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
getlocked-core = { path = "../../../crates/core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tokio = { version = "1.54.1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
